# The scheduler worker runs the same image as the web service and shares its configuration; only what it is told to
# run differs. `entrypoint: []` skips the entrypoint deliberately: it waits for the database and applies the
# migrations, and that is the web service's job. A worker starting before the schema is current would run commands
# against a half-migrated database, so it waits for `web` to report healthy instead.
x-worker: &worker
    image: abc.docker-registry.gewis.nl/db/gewisdb/web:production
    entrypoint: []
    environment: *app_environment
    depends_on:
        postfix:
            condition: service_started
        web:
            condition: service_healthy
    volumes:
        - logs-web:/app/var/log:rw
        - uploads:/app/public/data:rw
    networks:
        - network
    restart: unless-stopped
    # The image's health check asks Caddy's admin API on :2019, which only the web service runs.
    healthcheck:
        disable: true

services:
    web:
        image: abc.docker-registry.gewis.nl/db/gewisdb/web:production
        # env_file:
        #     - .env
        environment: *app_environment
        depends_on:
            - postfix
        volumes:
            - logs-web:/app/var/log:rw
            - uploads:/app/public/data:rw
            - caddy-data:/data:rw
            - caddy-config:/config:rw
        ports:
            - "80:80"
            - "443:443"
            - "443:443/udp"
        networks:
            - network
        restart: unless-stopped
    # The one schedule the application declares, consumed by one worker. Jobs run one after another, so a nightly
    # rebuild that overruns delays the hourly mailing list sync behind it rather than running alongside it.
    # `--time-limit` and `--memory-limit` recycle the process before a long-lived PHP worker starts to drift.
    scheduler:
        <<: *worker
        command: ["php", "bin/console", "messenger:consume", "scheduler_maintenance", "-vv", "--time-limit=3600", "--memory-limit=256M"]
    postfix:
        image: juanluisbaptiste/postfix
        env_file:
            - .env
#        environment:
#            - SMTP_SERVER=
#            - SMTP_PORT=
#            - SMTP_USERNAME=
#            - SMTP_PASSWORD=
#            - SERVER_HOSTNAME=
        networks:
            - network
        expose:
            - 1025
        restart: unless-stopped
        stop_grace_period: 60s

volumes:
    caddy-config:
    caddy-data:
    logs-web:

    uploads:

networks:
    network:
