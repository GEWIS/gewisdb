name: Docker Image CI

# Only run this action when pushing to main (development release) or on tagged versions (latest release).
on:
    push:
        branches:
            - main
        tags:
            - 'v*.*.*'

# Cancel running jobs that have become stale through updates to the ref (e.g., pushes to a pull request).
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    IS_RELEASE: ${{ format('{0}', startsWith(github.ref, 'refs/tags/')) }}

permissions: {}

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Get short commit SHA
                run: echo "SHORT_COMMIT_SHA=$(git rev-parse --short ${{ github.sha }})" >> $GITHUB_ENV

            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

            -   name: Login to Docker Registry
                uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
                with:
                    registry: ${{ vars.ABC_DOCKER_REGISTRY }}
                    username: ${{ secrets.SVC_GH_ABCDB_USERNAME }}
                    password: ${{ secrets.SVC_GH_ABCDB_PWD }}

            # One image, built from the root Dockerfile by target. There is no separate nginx image any more: the
            # web server is Caddy inside FrankenPHP, and the scheduler workers run this same image with a different
            # command.
            -   name: Build and push image
                uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
                with:
                    build-args: GIT_COMMIT=${{ env.SHORT_COMMIT_SHA }}
                    cache-from: type=gha
                    cache-to: type=gha,mode=max
                    context: .
                    file: ./Dockerfile
                    target: ${{ env.IS_RELEASE == 'true' && 'gewisdb_web_production' || 'gewisdb_web_development' }}
                    platforms: linux/amd64
                    push: true
                    tags: ${{ format('{0}:{1}', format('{0}/db/gewisdb/web', vars.ABC_DOCKER_REGISTRY), env.IS_RELEASE == 'true' && format('{0},{1}:latest', github.ref_name, format('{0}/db/gewisdb/web', vars.ABC_DOCKER_REGISTRY)) || 'development') }}
