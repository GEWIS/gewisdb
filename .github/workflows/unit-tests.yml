name: PHP Unit Tests

# Only run this action when pushing to main or on pull requests (creation, synchronisation, and reopening).
on:
    push:
        branches:
            - main
    pull_request:

# Cancel running jobs that have become stale through updates to the ref (e.g., pushes to a pull request).
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    phpunit:
        name: PHPUnit
        runs-on: ubuntu-latest

        # No database service: the suite is unit-level and boots no kernel. Adding tests that do will need a
        # `when@test` doctrine connection and dama/doctrine-test-bundle registered in config/bundles.php first
        # (the package is required but not enabled), and a Postgres service here to go with them.
        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Install PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.5'
                    extensions: calendar, curl, intl, ldap, opcache, pgsql, pdo_pgsql, zip

            -   name: Setup problem matchers for PHPUnit
                run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

            -   name: Install dependencies with Composer
                uses: ramsey/composer-install@v3

            -   name: Run PHPUnit
                run: bin/phpunit
