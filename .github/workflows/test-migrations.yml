name: Check migrations and seed

# Runs whenever an entity, migration, or fixture changes. On a slim web + database stack it:
#  - applies the migrations + seed from the base branch up to the head branch (and back down again), and
#  - verifies every entity change has a matching migration committed (i.e. no schema drift).
# Mailman and Listmonk are sync-based and not needed to exercise migrations or fixtures, so only the web +
# database containers are started.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'src/Entity/**/*.php'
      - 'src/DataFixtures/**/*.php'
      - 'migrations/**/*.php'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Shared compose file set for the docker compose invocations below.
  COMPOSE_FILES: --file compose.github.yaml --file compose.override.yaml --file compose.yaml
  # ReportDB's migrations are a second set and the bundle only holds one; without --configuration the ledger's
  # migrations are applied to the report connection. Mirrors REPORT_MIGRATIONS in the Makefile.
  REPORT_MIGRATIONS: --em=report --configuration=migrations/report.yaml

permissions: {}

jobs:
  migration_seed:
    name: Check migrations and seed
    runs-on: ubuntu-latest
    permissions:
        contents: read

    steps:
      - name: Echo
        run: echo "This job should only run if entities, migrations, or fixtures are updated"

      - name: Checkout base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      # `.env` is committed; `.env.local` is not, and the Makefile passes both to compose.
      - name: Prepare the local environment file
        run: make setuplocalenv

      - name: setup docker buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # --no-deps keeps this lightweight: only web + the database start, not the
      # sync-based mail/list services that web otherwise depends on.
      - name: run base
        run: docker compose $COMPOSE_FILES up -d --build --no-deps --quiet-pull web postgresql

      - name: wait for database (base)
        run: |
          for i in $(seq 1 30); do
            if docker compose $COMPOSE_FILES exec -T postgresql pg_isready -h 127.0.0.1 -p 5432 -q; then
              echo "Database is accepting connections."
              exit 0
            fi
            echo "Waiting for the database to accept connections... ($i/30)"
            sleep 2
          done
          echo "::error::Database did not become ready in time"
          docker compose $COMPOSE_FILES logs postgresql
          exit 1

      - name: migrate base
        run: make migrate

      - name: get migration status
        # `current` prints "<version> - <description>"; only the version is something to migrate back to.
        run: |
          MIGRATION_BASE_DEFAULT=$(docker compose exec -T web bin/console doctrine:migrations:current --no-interaction --em=default | sed 's/[[:space:]]-[[:space:]].*//' | tr -d '[:space:]')
          echo "Default is at: $MIGRATION_BASE_DEFAULT"
          echo "MIGRATION_BASE_DEFAULT=$MIGRATION_BASE_DEFAULT" >> $GITHUB_ENV
          MIGRATION_BASE_REPORT=$(docker compose exec -T web bin/console doctrine:migrations:current --no-interaction $REPORT_MIGRATIONS | sed 's/[[:space:]]-[[:space:]].*//' | tr -d '[:space:]')
          echo "Report is at: $MIGRATION_BASE_REPORT"
          echo "MIGRATION_BASE_REPORT=$MIGRATION_BASE_REPORT" >> $GITHUB_ENV

      - name: seed base
        run: |
          docker compose exec -T web bin/console doctrine:fixtures:load --no-interaction
          docker compose exec -T web bin/console report:generate:full

      - name: cleanup base
        run: docker compose $COMPOSE_FILES down

      - name: Checkout head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
            persist-credentials: false

      - name: Prepare the local environment file
        run: make setuplocalenv

      - name: run head
        run: docker compose $COMPOSE_FILES up -d --build --no-deps --quiet-pull web postgresql

      - name: wait for database (head)
        run: |
          for i in $(seq 1 30); do
            if docker compose $COMPOSE_FILES exec -T postgresql pg_isready -h 127.0.0.1 -p 5432 -q; then
              echo "Database is accepting connections."
              exit 0
            fi
            echo "Waiting for the database to accept connections... ($i/30)"
            sleep 2
          done
          echo "::error::Database did not become ready in time"
          docker compose $COMPOSE_FILES logs postgresql
          exit 1

      - name: migrate head
        run: make migrate

      - name: ensure migrations are up to date
        # Regenerate migrations from the current entities; any output here means an
        # entity changed without a matching migration being committed.
        run: |
          make migration-diff
          if git status --porcelain | grep -q 'migrations/'; then
            echo "::error::Entity changes detected without a matching migration. Run 'make migration-diff' locally and commit the generated migration(s)."
            git status --porcelain | grep 'migrations/'
            exit 1
          fi
          echo "All migrations are up to date."

      # Seeds the core databases only; `make seed` would also drive the sync-based Mailman
      # and Listmonk services, which `--no-deps` deliberately never started.
      - name: seed head
        run: |
          docker compose exec -T web bin/console doctrine:fixtures:load --no-interaction
          docker compose exec -T web bin/console report:generate:full

      - name: revert to base migration
        run: |
          docker compose exec -T web bin/console doctrine:migrations:migrate --no-interaction --em=default $MIGRATION_BASE_DEFAULT
          docker compose exec -T web bin/console doctrine:migrations:migrate --no-interaction $REPORT_MIGRATIONS $MIGRATION_BASE_REPORT

      - name: stop
        run: docker compose $COMPOSE_FILES down
