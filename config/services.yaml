# Pure autowire and autoconfigure. Do not introduce factory classes.

parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $mailFromAddress: '%env(MAIL_FROM_ADDRESS)%'
            string $mailFromName: '%env(MAIL_FROM_NAME)%'
            string $mailFromSecretaryAddress: '%env(MAIL_FROM_SECRETARY_ADDRESS)%'
            string $mailFromSecretaryName: '%env(MAIL_FROM_SECRETARY_NAME)%'
            string $mailToCheckerResultAddress: '%env(MAIL_TO_CHECKER_RESULT_ADDRESS)%'
            string $mailToCheckerResultName: '%env(MAIL_TO_CHECKER_RESULT_NAME)%'
            string $mailToReportErrorAddress: '%env(MAIL_TO_REPORT_ERROR_ADDRESS)%'
            string $mailToReportErrorName: '%env(MAIL_TO_REPORT_ERROR_NAME)%'
            string $mailToSubscriptionAddress: '%env(MAIL_TO_SUBSCRIPTION_ADDRESS)%'
            string $mailToSubscriptionName: '%env(MAIL_TO_SUBSCRIPTION_NAME)%'
            string $publicUrl: '%env(APP_URL)%'
            string $stripeApiVersion: '%env(STRIPE_API_VERSION)%'
            string $stripeSecretKey: '%env(STRIPE_SECRET_KEY)%'
            string $stripeWebhookSigningKey: '%env(STRIPE_WEBHOOK_SIGNING_KEY)%'
            string $stripeMembershipPriceId: '%env(STRIPE_MEMBERSHIP_PRICE_ID)%'
            string $stripeCancelUrl: '%env(STRIPE_CANCEL_URL)%'
            string $stripeSuccessUrl: '%env(STRIPE_SUCCESS_URL)%'
            array $enabledLocales: '%kernel.enabled_locales%'
            string $defaultLocale: '%kernel.default_locale%'
            string $storageDir: '%kernel.project_dir%/public/data'
            # Octal: the upload directory is shared with the web server's group.
            int $dirMode: 0770

    App\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/Kernel.php'

    # The connection the login firewall binds against. It is never opened unless a bind actually happens, so this is
    # harmless on the deployments that have no LDAP_SERVERS at all. See LdapEnvVarProcessor for the reshaping.
    Symfony\Component\Ldap\Ldap:
        factory: ['Symfony\Component\Ldap\Ldap', 'create']
        arguments:
            - 'ext_ldap'
            - connection_string: '%env(ldap_connection_string:default::LDAP_SERVERS)%'
              encryption: '%env(ldap_encryption:default::LDAP_STARTTLS)%'
              options:
                  # Active Directory refuses anything older, and chasing referrals breaks the bind.
                  protocol_version: 3
                  referrals: false

    # Both mailing clients take $endpoint/$username/$password, so these cannot be bound globally.
    App\Service\Mailing\MailmanService:
        bind:
            string $endpoint: '%env(MAILMAN_API_ENDPOINT)%'
            string $version: '%env(MAILMAN_API_VERSION)%'
            string $username: '%env(MAILMAN_API_USERNAME)%'
            string $password: '%env(MAILMAN_API_PASSWORD)%'

    App\Service\Mailing\ListmonkService:
        bind:
            string $endpoint: '%env(LISTMONK_API_ENDPOINT)%'
            string $username: '%env(LISTMONK_API_USERNAME)%'
            string $password: '%env(LISTMONK_API_PASSWORD)%'
