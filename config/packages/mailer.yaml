framework:
    mailer:
        dsn: '%env(MAILER_DSN)%'

# MAILER_DSN cannot be assembled from SMTP_*: those configure the postfix sidecar, not the application's target.

when@dev:
    framework:
        mailer:
            dsn: '%env(default:mailer_dev_dsn:MAILER_DSN)%'

parameters:
    mailer_dev_dsn: 'smtp://postfix:1025'
