framework:
    secret: '%env(APP_SECRET)%'

    # Trusted proxy addresses come from SYMFONY_TRUSTED_PROXIES. PROXY_HEADER has no equivalent — Symfony accepts
    # only its own enum, so a non-standard header has to be normalised at the edge.
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-host', 'x-forwarded-port']

    php_errors:
        log: true

when@test:
    framework:
        test: true
