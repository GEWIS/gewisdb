doctrine:
    dbal:
        default_connection: default
        connections:
            default:
                url: '%env(resolve:DATABASE_DSN)%'
                types:
                    stringable_datetime: App\Doctrine\Types\StringableDateTimeType
            report:
                url: '%env(resolve:REPORT_DATABASE_DSN)%'

    orm:
        default_entity_manager: default
        entity_managers:
            default:
                connection: default
                # doctrine-bundle defaults to `underscore_number_aware`, which would rename ConfigItem to
                # config_item and createdAt to created_at across both databases. The existing schema uses
                # Doctrine's DefaultNamingStrategy verbatim.
                naming_strategy: doctrine.orm.naming_strategy.default
                # ORM 3 resolves AUTO to IDENTITY on PostgreSQL where ORM 2 resolved it to SEQUENCE. The id
                # columns are plain INT with no DEFAULT nextval(...), so IDENTITY fails every INSERT.
                identity_generation_preferences:
                    Doctrine\DBAL\Platforms\PostgreSQLPlatform: sequence
                mappings:
                    Application:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Entity/Application'
                        prefix: 'App\Entity\Application'
                    Decision:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Entity/Decision'
                        prefix: 'App\Entity\Decision'
                    Member:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Entity/Member'
                        prefix: 'App\Entity\Member'
                    Join:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Entity/Join'
                        prefix: 'App\Entity\Join'
                    Mailing:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Entity/Mailing'
                        prefix: 'App\Entity\Mailing'
                    Query:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Entity/Query'
                        prefix: 'App\Entity\Query'
                    User:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Entity/User'
                        prefix: 'App\Entity\User'

            # GEWISWEB reads these tables directly over PostgreSQL, so this DDL is a cross-system contract.
            report:
                connection: report
                naming_strategy: doctrine.orm.naming_strategy.default
                identity_generation_preferences:
                    Doctrine\DBAL\Platforms\PostgreSQLPlatform: sequence
                mappings:
                    Report:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Entity/Report'
                        prefix: 'App\Entity\Report'
                dql:
                    numeric_functions:
                        YEAR: App\Doctrine\Functions\Year

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
